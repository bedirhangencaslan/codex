[package]
name = "suffice-gui-desktop"
version = "0.1.0"
edition = "2021"
description = "Suffice GUI desktop shell (Tauri) — wraps the gui/web bundle"
license = "Apache-2.0"

# Standalone project on purpose: the codex-rs Cargo workspace and the Bazel
# module must not absorb the Tauri dependency tree.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
